<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homebase</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Homebase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#16201D; --muted:#5B6763; --soft:#4A5551;
  --line:#E2E8E5; --line2:#EDF1EF; --tint:#F8FAF9;
  --accent:#1F7A63; --accent-ink:#1F6E5A; --accent-soft:#E3F1EC;
  --warn:#A04A08; --warn-soft:#FDF0E3; --info:#2F5E9E; --info-soft:#E8EEF7; --neu:#EEF2F0;
  --danger:#B42318;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{flex:0 0 232px;padding:28px 16px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 24px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.bname{font-size:18px;font-weight:700;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--soft);text-decoration:none;font-weight:500;font-size:14px}
.nav:hover{background:var(--neu);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.content{flex:1 1 auto;min-width:0;padding:36px 40px 48px;display:flex;flex-direction:column;gap:24px;max-width:1200px}

@media (max-width:760px){
  .shell{flex-direction:column}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
  .brand{display:none}
  .side .nav{flex:1 1 0;flex-direction:column;justify-content:center;gap:3px;min-height:52px;padding:4px 2px;font-size:11px;text-align:center}
  .content{padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));gap:20px}
  h1{font-size:26px!important}
}

/* ---------- common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.clip{overflow:hidden}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--accent-soft);color:var(--accent-ink)}
.p-neu{background:var(--neu);color:var(--soft)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-dark{background:var(--ink);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid #D5DDD9;background:#fff;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#F1C8C4}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #D5DDD9;background:#fff;font-weight:600;font-size:13px;color:var(--soft);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mut{color:var(--muted)}
.sm-t{font-size:13px}
.num{font-family:var(--mono);font-weight:600;font-size:14px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.kicker{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
.hact{display:flex;flex-wrap:wrap;gap:10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
.hd h2{font-size:17px;font-weight:700}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 20px 10px;font-size:14px;font-weight:700;border-top:1px solid var(--line);background:var(--tint)}
.grp:first-child{border-top:0}
.grp .gname{background:none;border:0;padding:0;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.bar{flex:1;height:6px;border-radius:999px;background:#E6ECE9;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.emptyline{padding:18px 20px;border-top:1px solid var(--line2);color:var(--muted);font-size:14px}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
.empty{padding:28px;display:flex;flex-direction:column;gap:12px}
.empty h2{font-size:20px}
.empty p{color:var(--muted);line-height:1.55;font-size:15px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.foot{padding:12px 20px;border-top:1px solid var(--line2)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:18px 20px}
.stat p:first-child{font-size:13px;color:var(--muted);font-weight:500}
.stat p:last-child{margin-top:6px;font-size:28px;font-weight:700}

/* task rows */
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px;border-top:1px solid var(--line2)}
.tmain{flex:1 1 240px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tname{font-size:15px;font-weight:600}
.tsub{font-size:13px;color:var(--muted)}
.tside{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tdue{font-size:13px;font-weight:600}
.is-done .tname{color:var(--muted);text-decoration:line-through;font-weight:500}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{display:flex;flex-direction:column;gap:14px;padding:20px;text-decoration:none;color:var(--ink)}
.pc.big{grid-column:1/-1;border-color:#C9DDD5}
.pc.faded{background:#FAFBFA}
.pc h2{font-size:18px;font-weight:700}
.pc.big h2{font-size:20px}
.pctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.desc{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.5;white-space:pre-line}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:14px;border-top:1px solid var(--line2)}
.ml{font-size:12px;color:var(--muted);font-weight:500}
.mv{margin-top:2px;font-size:14px;font-weight:700}
.newcard{min-height:200px;border:1.5px dashed #C8D2CE;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--soft);cursor:pointer;border-radius:14px}
.mini{display:block;padding:16px 20px;text-decoration:none;color:var(--ink)}
.mini-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;font-size:15px}
.mini .bar{margin:12px 0}

/* project detail */
.phero{padding:24px;display:flex;flex-wrap:wrap;gap:20px 24px;align-items:center;justify-content:space-between}
.phero .info{flex:1 1 320px;min-width:0}
.phero h1{font-size:28px}
.hstats{display:flex;gap:28px;flex-wrap:wrap}
.hstats p:first-child{font-size:12px;color:var(--muted);font-weight:500}
.hstats p:last-child{margin-top:2px;font-size:22px;font-weight:700}
.hstats small{font-size:15px;color:var(--muted);font-weight:600}
.fullbar{flex-basis:100%;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.back{font-size:14px;font-weight:600;text-decoration:none;align-self:flex-start;min-height:28px;display:inline-flex;align-items:center}
.step{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 20px;border-top:1px solid var(--line2)}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid #B9C4C0;background:#fff;flex:none;margin:0;appearance:none;-webkit-appearance:none;cursor:pointer;display:grid;place-items:center}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.itxt{flex:1;min-width:0;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
.done-t{color:var(--muted);text-decoration:line-through;font-weight:500}
.ms{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;min-height:48px;padding:10px 20px;border:0;border-top:1px solid var(--line2);background:none;text-align:left;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink)}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px;border-top:1px solid var(--line2)}
.prow .tmain{flex:1 1 220px}
.pmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.pillbtn{border:0;cursor:pointer}
.updform{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 16px}
.updform input{flex:1 1 220px;min-height:44px;border:1px solid #D5DDD9;border-radius:10px;padding:0 14px;font-size:15px;background:#fff}
.upd{display:flex;gap:16px;padding:14px 20px;border-top:1px solid var(--line2);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;cursor:pointer}
.upd .d{flex:none;width:64px;font-size:13px;font-weight:700;color:var(--muted)}
.upd p{font-size:14px;line-height:1.55;white-space:pre-line}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.sub .sname{flex:1 1 200px;font-size:15px;font-weight:600}
.sub .bar{flex:none;width:80px}
.bl{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid var(--line2);font-size:14px}

/* rooms */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rc{display:flex;flex-direction:column;gap:12px;padding:18px;text-decoration:none;color:var(--ink)}
.rc.sel{border:2px solid var(--accent);padding:17px}
.rc h2{font-size:18px;font-weight:700;margin-top:2px}
.rc .fl{font-size:12px;font-weight:600;color:var(--muted)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.rsplit{display:flex;flex-wrap:wrap;border-top:1px solid var(--line)}
.rsplit>div{flex:1 1 320px;min-width:0}
.sec-h{padding:14px 20px 10px;font-size:14px;font-weight:700;background:var(--tint);border-top:1px solid var(--line)}
.rsplit>div>.sec-h:first-child{border-top:0}

/* history */
.hrow{display:flex;gap:14px;padding:12px 20px;border-top:1px solid var(--line2);font-size:14px;align-items:baseline}
.hrow .d{flex:none;width:64px;font-size:13px;font-weight:700;color:var(--muted)}

/* dialog */
dialog{border:0;padding:0;border-radius:16px;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 48px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(22,32,29,.25)}
dialog::backdrop{background:rgba(22,32,29,.35)}
#dform{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.dhead h2{font-size:19px;font-weight:700}
.x{width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);margin-right:-10px}
.dbody{display:flex;flex-wrap:wrap;gap:14px 12px;padding:8px 20px 16px;overflow:auto}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px)}
.fld label{font-size:13px;font-weight:600;color:var(--soft)}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid #D5DDD9;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}
.fld textarea{min-height:90px;resize:vertical}
.fld .bad{border-color:var(--danger)}
.chkfld{flex-direction:row;align-items:center;gap:10px;font-size:15px;font-weight:600;min-height:44px}
.hint{flex:1 1 100%;font-size:13px;color:var(--muted);line-height:1.5}
.dact{display:flex;gap:10px;padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);flex-wrap:wrap}
.sp{flex:1}
@media (max-width:760px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh}
  #dform{max-height:92dvh}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.signed-out .side{display:none}
.signed-out .content{padding-bottom:40px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
      <span class="bname">Homebase</span>

    <a class="nav" data-tab="projects" href="#projects"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Projects</a>

    <a class="nav" data-tab="more" href="#more"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>More</a>
  </nav>
  <main class="content" id="view" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dtitle"></dialog>
<input type="file" id="importFile" accept="application/json,.json" class="vh" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =========================================================
   Homebase — cleaning + home project tracker
   Shared between household members through Firebase:
   sign in with email + password, data syncs live.
   ========================================================= */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ▼▼▼ PASTE YOUR FIREBASE CONFIG HERE (Project settings → Your apps → Web app) ▼▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyBeQ7QRj-ZLb0zOS7RiiJnLVfBeCrNIwfA",
  authDomain: "homebase-5cd93.firebaseapp.com",
  projectId: "homebase-5cd93",
  storageBucket: "homebase-5cd93.firebasestorage.app",
  messagingSenderId: "291920905642",
  appId: "1:291920905642:web:585d43e42831af712857d3"
};
/* ▲▲▲ ------------------------------------------------------------------ ▲▲▲ */

const HOME = 'main';                       // all household data lives under homes/main
const COLLS = ['rooms', 'tasks', 'projects'];
const configured = !String(firebaseConfig.apiKey).startsWith('PASTE');

let data = null;          // in-memory copy of everything; screens read from this
let user = null;          // signed-in Firebase user
let authReady = false;
let syncError = '';
let auth, db, unsubs = [];
const synced = { rooms: new Map(), tasks: new Map(), projects: new Map() }; // id -> JSON as last seen in the cloud
let syncedMeta = '{}';
let firstLoads = 0, pendingRender = false;
const ui = { cleanFilter: 'all', cleanGroup: 'room', projFilter: 'all', showSubs: false, floor: 'all' };

/* ---------- old on-phone storage (only used to move data into the shared copy once) ---------- */
const DB_NAME = 'homebase', STORE = 'kv';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const q = db.transaction(STORE).objectStore(STORE).get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function dbSet(key, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------- cloud sync ---------- */
// JSON with keys sorted, so the same item always produces the same text
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function startSync() {
  stopSync();
  data = normalize({}); firstLoads = 0; syncError = '';
  COLLS.forEach(c => synced[c].clear()); syncedMeta = '{}';
  const onErr = err => {
    console.error(err);
    syncError = err.code === 'permission-denied'
      ? `This account (${user.email}) isn't allowed into Homebase. Check the two email addresses in your Firestore rules.`
      : 'Could not reach Homebase: ' + (err.message || err.code);
    render();
  };
  COLLS.forEach(c => {
    unsubs.push(onSnapshot(collection(db, 'homes', HOME, c), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed') synced[c].delete(ch.doc.id);
        else synced[c].set(ch.doc.id, stable({ ...ch.doc.data(), id: ch.doc.id }));
      });
      data[c] = [...synced[c].entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([, js]) => JSON.parse(js));
      normalize(data);
      if (++firstLoads === COLLS.length) offerMove();
      scheduleRender();
    }, onErr));
  });
  unsubs.push(onSnapshot(doc(db, 'homes', HOME), s => {
    const m = s.exists() ? s.data() : {};
    syncedMeta = stable({ lastExport: m.lastExport || null });
    data.lastExport = m.lastExport || null;
    scheduleRender();
  }, onErr));
}
function stopSync() { unsubs.forEach(u => u()); unsubs = []; }

// Compare what's on screen with what the cloud last sent; write only the items that changed.
async function save() {
  if (!user || !db || !data) return;
  const ops = [];
  for (const c of COLLS) {
    const cur = new Map(data[c].map(o => [o.id, stable(o)]));
    for (const [id, js] of cur) if (synced[c].get(id) !== js) ops.push(['set', doc(db, 'homes', HOME, c, id), JSON.parse(js)]);
    for (const id of synced[c].keys()) if (!cur.has(id)) ops.push(['del', doc(db, 'homes', HOME, c, id)]);
    synced[c] = cur;
  }
  const meta = stable({ lastExport: data.lastExport || null });
  if (meta !== syncedMeta) { ops.push(['set', doc(db, 'homes', HOME), JSON.parse(meta)]); syncedMeta = meta; }
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db);
      ops.slice(i, i + 400).forEach(([kind, ref, val]) => kind === 'set' ? b.set(ref, val) : b.delete(ref));
      await b.commit();
    }
  } catch (e) { console.error(e); toast("Couldn't save — check your connection"); }
}
function commit() { save(); render(); }

// Live updates from the other phone: wait if a form is open or an update is being typed.
function scheduleRender() {
  const a = document.activeElement;
  if ($('#dlg').open || (a && a.id === 'updText' && a.value)) { pendingRender = true; return; }
  render();
}
function flushRender() { if (pendingRender) { pendingRender = false; render(); } }

// One time: if this phone has data from before sharing, offer to move it in.
async function offerMove() {
  if (hasData()) return;
  let raw = null;
  try { raw = await dbGet('data'); } catch { return; }
  if (!raw) return;
  let old; try { old = JSON.parse(raw); } catch { return; }
  const n = (old.rooms || []).length + (old.tasks || []).length + (old.projects || []).length;
  if (!n) return;
  if (confirm(`Found Homebase data saved on this phone from before sharing (${n} items).\n\nMove it into your shared Homebase?`)) {
    data = normalize(old); commit(); toast('Moved into shared Homebase');
  }
  try { await dbSet('data', ''); } catch {}
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const relDate = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(s) {
  if (!s) return '—';
  const d = parseD(s);
  const y = d.getFullYear() !== new Date().getFullYear() ? `, ${d.getFullYear()}` : '';
  return `${MON[d.getMonth()]} ${d.getDate()}${y}`;
}
function addEvery(s, ev) {
  const d = parseD(s), n = Math.max(1, +ev.n || 1);
  if (ev.unit === 'day') d.setDate(d.getDate() + n);
  else if (ev.unit === 'week') d.setDate(d.getDate() + 7 * n);
  else if (ev.unit === 'month') {
    const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  } else d.setFullYear(d.getFullYear() + n);
  return iso(d);
}
const UNIT = { day: ['Daily', 'day'], week: ['Weekly', 'week'], month: ['Monthly', 'month'], year: ['Yearly', 'year'] };
function everyText(ev) {
  const n = Math.max(1, +ev.n || 1), u = UNIT[ev.unit] || UNIT.week;
  return n === 1 ? u[0] : `Every ${n} ${u[1]}s`;
}
const nextDue = t => t.lastDone ? addEvery(t.lastDone, t.every) : todayISO();
function dueInfo(t) {
  const d = daysBetween(todayISO(), nextDue(t));
  if (d < 0) return { d, cls: 'warn', label: d === -1 ? '1 day late' : `${-d} days late` };
  if (d === 0) return { d, cls: 'ok', label: 'Due today' };
  if (d === 1) return { d, cls: 'neu', label: 'Tomorrow' };
  return { d, cls: 'neu', label: `In ${d} days` };
}
const money = n => '$' + (+n || 0).toLocaleString('en-CA', { minimumFractionDigits: (+n % 1 ? 2 : 0), maximumFractionDigits: 2 });
const roomName = id => (data.rooms.find(r => r.id === id) || {}).name || '';
const roomOptions = () => [['', 'No room'], ...data.rooms.map(r => [r.id, r.name])];
const pill = (label, cls) => `<span class="pill p-${cls}">${esc(label)}</span>`;
const bar = (pct, h = 6) => `<div class="bar" style="height:${h}px"><span style="width:${pct}%"></span></div>`;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- projects ---------- */
const STATUS = { planning: ['Planning', 'info'], 'in-progress': ['In progress', 'ok'], waiting: ['Waiting on parts', 'warn'], done: ['Done', 'neu'] };
const STATUS_OPTS = Object.entries(STATUS).map(([k, v]) => [k, v[0]]);
const isBig = p => p.kind === 'big';
const kids = p => data.projects.filter(c => c.parentId === p.id);
const findP = id => data.projects.find(p => p.id === id);
const statusPill = p => pill((STATUS[p.status] || STATUS.planning)[0], (STATUS[p.status] || STATUS.planning)[1]);
function progress(p) {
  if (isBig(p)) {
    const k = kids(p);
    return k.length ? Math.round(k.reduce((a, c) => a + progress(c), 0) / k.length) : (p.status === 'done' ? 100 : 0);
  }
  if (p.status === 'done') return 100;
  const s = p.steps || [];
  return s.length ? Math.round(s.filter(x => x.done).length / s.length * 100) : 0;
}
function spent(p) {
  if (isBig(p)) return kids(p).reduce((a, c) => a + spent(c), 0);
  return p.parts.filter(x => x.have).reduce((a, x) => a + (+x.cost || 0), 0);
}
function lastUpdated(p) {
  const dates = [p.updatedAt, ...(isBig(p) ? kids(p).map(lastUpdated) : [])].filter(Boolean).sort();
  return dates[dates.length - 1] || null;
}
function touch(p) {
  if (!p || !p.id || p.info) return;
  p.updatedAt = todayISO();
  if (p.parentId) { const par = findP(p.parentId); if (par) par.updatedAt = todayISO(); }
}
function groupList(p) {
  const g = [...p.groups];
  kids(p).forEach(c => { if (c.group && !g.includes(c.group)) g.push(c.group); });
  if (kids(p).some(c => !c.group)) g.push('');
  return g;
}

/* ---------- data shape ---------- */
function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  d.version = 1; delete d.savedAt;
  d.rooms = Array.isArray(d.rooms) ? d.rooms : [];
  d.tasks = Array.isArray(d.tasks) ? d.tasks : [];
  d.projects = Array.isArray(d.projects) ? d.projects : [];
  d.rooms.forEach(r => { r.id = r.id || uid(); r.name = r.name || 'Room'; r.info = Array.isArray(r.info) ? r.info : []; });
  d.tasks.forEach(t => {
    t.id = t.id || uid(); t.name = t.name || 'Task';
    t.every = t.every && UNIT[t.every.unit] ? t.every : { n: 1, unit: 'week' };
    t.history = Array.isArray(t.history) ? t.history : [];
  });
  d.projects.forEach(p => {
    p.id = p.id || uid(); p.name = p.name || 'Project';
    p.kind = p.kind === 'big' ? 'big' : 'regular';
    p.status = STATUS[p.status] ? p.status : 'planning';
    ['steps', 'measurements', 'parts', 'updates', 'quick', 'groups'].forEach(k => { p[k] = Array.isArray(p[k]) ? p[k] : []; });
  });
  return d;
}
const hasData = () => data.tasks.length || data.projects.length || data.rooms.length;
const needsBackup = () => hasData() && (!data.lastExport || daysBetween(data.lastExport.slice(0, 10), todayISO()) >= 14);

/* ---------- router ---------- */
function route() {

}
const VIEWS = { today: vToday, cleaning: vCleaning, projects: vProjects, project: vProject, rooms: vRooms, more: vMore };
function render() {

  if (syncError) { $('#view').innerHTML = `<section class="card empty"><h2>Can't open Homebase</h2><p>${esc(syncError)}</p><div class="row-btns"><button class="btn" data-act="signOut">Sign out</button></div></section>`; return; }
  if (!data) return;

}
const head = (kicker, title, actions = '') =>
  `<header class="phead"><div><p class="kicker">${esc(kicker)}</p><h1>${esc(title)}</h1></div><div class="hact">${actions}</div></header>`;

/* ---------- shared rows ---------- */
function taskRow(t, showRoom = true) {
  const di = dueInfo(t), done = t.lastDone === todayISO();
  const room = showRoom && roomName(t.roomId) ? ' · ' + esc(roomName(t.roomId)) : '';

function miniProject(p) {

  const toBuy = p.parts.filter(x => !x.have).length;
  const bits = [next ? 'Next: ' + next.text : '', toBuy ? `${toBuy} part${toBuy > 1 ? 's' : ''} to buy` : (p.parts.length ? 'All parts on hand' : ''), parent ? 'Part of ' + parent.name : ''].filter(Boolean);

/* ---------- Today ---------- */

/* ---------- Projects ---------- */

function projectForm(p, preset = {}) {

  }
  const n = data.rooms.length;
  return head(`${n} room${n === 1 ? '' : 's'}${floors.length ? ` · ${floors.length} floor${floors.length === 1 ? '' : 's'}` : ''}`, 'Rooms', `<button class="btn pri" data-act="addRoom">+ Room</button>`) +
    (floors.length > 1 ? `<div class="chips">${chip('all', 'All floors')}${floors.map(f => chip(f, f)).join('')}</div>` : '') +
    (n ? `<section class="rgrid" aria-label="Rooms">${cards}</section>` : `<section class="card empty"><h2>No rooms yet</h2><p>Add the rooms in your house. Each room keeps its own info (sizes, paint, bulbs, filters) and shows its cleaning and projects.</p><div class="row-btns"><button class="btn pri" data-act="addRoom">+ Add a room</button></div></section>`) +
    (sel ? detail : (n ? '<p class="sm-t mut">Tap a room to see its info, cleaning and projects.</p>' : ''));
}
function roomForm(r) {
  const isNew = !r;
  const floors = [...new Set(data.rooms.map(x => x.floor).filter(Boolean))];
  openForm({
    title: isNew ? 'New room' : 'Edit room',
    fields: [{ key: 'name', label: 'Room', required: true, placeholder: 'Kitchen' }, { key: 'floor', label: 'Floor / area', placeholder: 'Main floor', list: floors.length ? floors : ['Main floor', 'Upstairs', 'Basement', 'Outside'] }],
    values: r || {},
    onSave: v => {
      if (isNew) { const nr = { id: uid(), info: [], ...v }; data.rooms.push(nr); location.hash = '#rooms/' + nr.id; }
      else Object.assign(r, v);
    },
    onDelete: isNew ? null : () => {
      data.rooms = data.rooms.filter(x => x !== r);
      data.tasks.forEach(t => { if (t.roomId === r.id) t.roomId = ''; });
      data.projects.forEach(p => { if (p.roomId === r.id) p.roomId = ''; });
      location.hash = '#rooms';
    },
    deleteMsg: 'Delete this room? Its tasks and projects stay, just without a room.',
  });
}

/* ---------- More: backup + history ---------- */
function vMore() {
  const ev = [];
  data.tasks.forEach(t => t.history.forEach(d => ev.push({ d, kind: 'Cleaned', text: t.name, sub: roomName(t.roomId) })));
  data.projects.forEach(p => p.updates.forEach(u => ev.push({ d: u.date || '', kind: 'Update', text: u.text, sub: p.name, href: '#project/' + p.id })));
  ev.sort((a, b) => b.d.localeCompare(a.d));
  const hist = ev.slice(0, 60).map(e => `<div class="hrow"><span class="d">${fmt(e.d)}</span><div style="min-width:0"><p style="font-weight:600;white-space:pre-line">${esc(e.text)}</p><p class="sm-t mut">${e.kind}${e.sub ? ' · ' + (e.href ? `<a href="${e.href}">${esc(e.sub)}</a>` : esc(e.sub)) : ''}</p></div></div>`).join('');
  return head('Account, backup + history', 'More') + `
  <section class="card clip">
    <div class="hd"><h2>Account</h2><button class="btn sm" data-act="signOut">Sign out</button></div>
    <p class="sm-t mut" style="padding:0 20px 18px;line-height:1.55">Signed in as <b style="color:var(--ink)">${esc(user.email)}</b>. Everything here is shared live with your household.</p>
  </section>
  <section class="card clip">
    <div class="hd"><h2>Backup</h2></div>
    <div style="padding:0 20px 18px;display:flex;flex-direction:column;gap:12px">
      <p class="sm-t mut" style="line-height:1.55">Your data is stored in your shared Homebase and synced to both phones. A JSON backup now and then (save it to Files, iCloud or Google Drive) is still a good safety net.</p>
      <p class="sm-t"><b>Last backup:</b> ${data.lastExport ? fmt(data.lastExport.slice(0, 10)) : 'never'}</p>
      <div class="row-btns" style="margin:0"><button class="btn pri" data-act="export">Export backup (.json)</button><button class="btn" data-act="import">Restore from backup</button></div>
    </div>
  </section>
  <section class="card clip">
    <div class="hd"><h2>History</h2></div>
    ${hist || '<p class="emptyline">Finished cleaning tasks and project updates show up here.</p>'}
  </section>
  <section class="card clip">
    <div class="hd"><h2>Start over</h2></div>
    <div style="padding:0 20px 18px" class="row-btns"><button class="btn" data-act="sample">Load sample data</button><button class="btn danger" data-act="erase">Erase everything</button></div>
  </section>`;
}
async function exportData() {
  const json = JSON.stringify(data, null, 2);
  const name = `homebase-backup-${todayISO()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  const mark = () => { data.lastExport = new Date().toISOString(); commit(); toast('Backup saved'); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Homebase backup' });
      mark(); return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  mark();
}
async function importFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { alert("That file isn't a Homebase backup (couldn't read it)."); return; }
  if (!obj || !Array.isArray(obj.tasks) || !Array.isArray(obj.projects) || !Array.isArray(obj.rooms)) { alert("That file isn't a Homebase backup."); return; }
  if (hasData() && !confirm(`Replace everything in Homebase (for everyone) with this backup?\n\n${obj.rooms.length} rooms · ${obj.tasks.length} tasks · ${obj.projects.length} projects`)) return;
  data = normalize(obj);
  commit(); location.hash = '#today'; toast('Backup restored');
}
function sampleData() {
  const r = n => ({ id: uid(), name: n[0], floor: n[1], info: [] });
  const R = { kit: r(['Kitchen', 'Main floor']), liv: r(['Living room', 'Main floor']), hall: r(['Hallway + entry', 'Main floor']), bed: r(['Primary bedroom', 'Upstairs']), nur: r(['Nursery', 'Upstairs']), bath: r(['Bathrooms', 'Upstairs']), lau: r(['Laundry', 'Basement']), gar: r(['Garage', 'Outside']), yard: r(['Yard + deck', 'Outside']) };
  R.kit.info.push({ id: uid(), label: 'Floor size', value: `12' 4" × 14' 0"` }, { id: uid(), label: 'Pot lights', value: '6 × 4" LED, 3000K' }, { id: uid(), label: 'Range hood filter', value: '[size / part #]' });
  const t = (name, room, n, unit, ago, notes = '') => { const last = relDate(-ago); return { id: uid(), name, roomId: room.id, every: { n, unit }, lastDone: last, history: [relDate(-ago - (unit === 'day' ? n : unit === 'week' ? 7 * n : 30 * n)), last], notes }; };
  const tasks = [
    t('Wipe stovetop + range hood filter', R.kit, 2, 'week', 16), t('Sanitize bottle station', R.kit, 1, 'day', 1), t('Clean out fridge', R.kit, 1, 'week', 5),
    t('Vacuum main floor', R.liv, 3, 'day', 3), t('Change bed sheets', R.bed, 1, 'week', 7), t('Scrub tub + shower glass', R.bath, 1, 'week', 6),
    t('Deep clean litter boxes', R.lau, 1, 'week', 8), t('Replace furnace filter', R.lau, 3, 'month', 65, 'Filter size: [16×25×1]'), t('Take out recycling', R.gar, 1, 'week', 7),
  ];
  const s = (text, done = false) => ({ id: uid(), text, done });
  const P = (o) => ({ id: uid(), kind: 'regular', status: 'planning', roomId: '', description: '', budget: null, startDate: relDate(-14), targetDate: '', parentId: null, group: '', steps: [], measurements: [], parts: [], updates: [], quick: [], groups: [], updatedAt: relDate(-3), ...o });
  const shelf = P({ name: 'Basement laundry shelving', status: 'in-progress', roomId: R.lau.id, budget: 250, description: 'Two-tier wall shelf over the washer and dryer.',
    steps: [s('Find and mark studs', true), s('Buy lumber + brackets', true), s('Sand and prime shelf boards', true), s('Cut uprights to 84"'), s('Mount wall standards, check level'), s('Install shelves + edge trim')],
    measurements: [{ id: uid(), label: 'Wall width (finished)', value: '96 1/4"' }, { id: uid(), label: 'Lower shelf height', value: '48" AFF' }, { id: uid(), label: 'Shelf depth', value: '15 1/4"' }, { id: uid(), label: 'Stud locations from left', value: '8" · 24" · 40" · 56"' }],
    parts: [{ id: uid(), name: 'Shelf board, laminated pine', spec: '3/4" × 16" × 96"', qty: '2', where: 'Home Depot', cost: 74, have: true }, { id: uid(), name: 'Twin-track wall standard', spec: '84", white', qty: '4', where: 'Home Depot', cost: 43.92, have: true }, { id: uid(), name: 'Shelf bracket', spec: '14", twin-track', qty: '8', where: 'Home Depot', cost: null, have: false }, { id: uid(), name: 'Edge banding', spec: '3/4" iron-on, white', qty: '25 ft', where: "Lowe's", cost: null, have: false }],
    updates: [{ id: uid(), date: relDate(-3), text: 'Primed both boards. Brackets out of stock — try another store.' }, { id: uid(), date: relDate(-10), text: 'Found and marked studs. Wall is a bit out of plumb on the left — shim the first standard.' }] });
  const blinds = P({ name: 'Nursery blackout blinds', status: 'waiting', roomId: R.nur.id, description: 'Inside-mount cordless blinds for both windows.', steps: [s('Measure window inside frame', true), s('Order blinds'), s('Install')] });
  const sell = P({ kind: 'big', name: 'Get the house ready to sell', status: 'in-progress', budget: 6500, targetDate: relDate(150), description: 'Everything that needs doing before the listing photos.', groups: ['Repairs + fixes', 'Paint + finishes', 'Curb appeal', 'Declutter + staging', 'Paperwork + agent'],
    quick: [s('Replace burnt-out bulbs'), s('Fix sticky bedroom closet door'), s('Tighten kitchen cabinet hinges'), s('Replace furnace filter', true)] });
  const sub = (name, group, o = {}) => P({ name, group, parentId: sell.id, ...o });
  const subs = [
    sub('Fix leaky ensuite faucet', 'Repairs + fixes', { status: 'done', roomId: R.bath.id, parts: [{ id: uid(), name: 'Cartridge', spec: '[model #]', qty: '1', where: 'Home Depot', cost: 38, have: true }] }),
    sub('Patch drywall dents in hallway', 'Repairs + fixes', { status: 'in-progress', roomId: R.hall.id, steps: [s('Fill dents', true), s('Sand', true), s('Second coat'), s('Prime')], parts: [{ id: uid(), name: 'Joint compound', spec: 'Lightweight, 3.5 L', qty: '1', where: 'Garage', cost: 24, have: true }] }),
    sub('Re-caulk front windows', 'Repairs + fixes', { budget: 60 }),
    sub('Repaint main floor walls', 'Paint + finishes', { status: 'waiting', budget: 420, description: 'Waiting on drywall.' }),
    sub('Power wash + stain back deck', 'Curb appeal', { roomId: R.yard.id, budget: 350 }),
    sub('Clear out the garage', 'Declutter + staging', { status: 'in-progress', roomId: R.gar.id, steps: [s('Sort keep / donate / dump', true), s('Dump run'), s('Donation drop-off')] }),
    sub('Pre-listing home inspection', 'Paperwork + agent', { budget: 500 }),
  ];
  return normalize({ rooms: Object.values(R), tasks, projects: [shelf, blinds, sell, ...subs] });
}

/* ---------- forms (dialog) ---------- */
let formCtx = null;
function fieldHTML(f, v) {
  const id = 'f_' + f.key, t = f.type || 'text';
  if (t === 'checkbox') return `<label class="fld chkfld" for="${id}"><input type="checkbox" class="chk" id="${id}" name="${f.key}"${v ? ' checked' : ''}> ${esc(f.label)}</label>`;
  let input;
  if (t === 'select') input = `<select id="${id}" name="${f.key}">${f.options.map(([val, l]) => `<option value="${esc(val)}"${String(v ?? '') === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (t === 'textarea') input = `<textarea id="${id}" name="${f.key}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(v ?? '')}</textarea>`;
  else {
    const list = f.list ? ` list="dl_${f.key}"` : '';
    input = `<input id="${id}" name="${f.key}" type="${t}"${t === 'number' ? ` inputmode="decimal" step="any"${f.min != null ? ` min="${f.min}"` : ''}` : ''} value="${esc(v ?? '')}" placeholder="${esc(f.placeholder || '')}"${list} autocomplete="off">` +
      (f.list ? `<datalist id="dl_${f.key}">${f.list.map(x => `<option value="${esc(x)}"></option>`).join('')}</datalist>` : '');
  }
  return `<div class="fld${f.half ? ' half' : ''}"><label for="${id}">${esc(f.label)}${f.required ? '' : ''}</label>${input}</div>`;
}
function openForm(cfg) {
  formCtx = cfg;
  const d = $('#dlg');
  d.innerHTML = `<form id="dform" novalidate>
    <div class="dhead"><h2 id="dtitle">${esc(cfg.title)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
    <div class="dbody">${cfg.fields.map(f => fieldHTML(f, (cfg.values || {})[f.key])).join('')}${cfg.extra || ''}</div>
    <div class="dact">${cfg.onDelete ? '<button type="button" class="btn danger" data-del>Delete</button>' : ''}<span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn pri">Save</button></div>
  </form>`;
  d.showModal();
  const coarse = matchMedia('(pointer:coarse)').matches;
  if (!coarse) { const first = d.querySelector('.dbody input:not([type=checkbox]),.dbody textarea'); if (first) first.focus(); }
}
const closeDlg = () => { const d = $('#dlg'); if (d.open) d.close(); formCtx = null; };

document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); doLogin(e.target); return; }
  if (e.target.id !== 'dform') return;
  e.preventDefault();
  const cfg = formCtx, fm = e.target, vals = {};
  if (!cfg) return;
  for (const f of cfg.fields) {
    const el = fm.elements[f.key];
    if (f.type === 'checkbox') vals[f.key] = el.checked;
    else if (f.type === 'number') vals[f.key] = el.value === '' ? null : Number(el.value);
    else vals[f.key] = el.value.trim();
  }
  const miss = cfg.fields.find(f => f.required && !vals[f.key]);
  if (miss) { const el = fm.elements[miss.key]; el.classList.add('bad'); el.focus(); return; }
  cfg.onSave(vals);
  closeDlg(); commit();
});

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeDlg(); return; }
  if (e.target.closest('[data-del]')) {
    const cfg = formCtx;
    if (cfg && confirm(cfg.deleteMsg || "Delete this? This can't be undone.")) { cfg.onDelete(); closeDlg(); commit(); }
    return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, T = () => data.tasks.find(x => x.id === d.id);
  switch (d.act) {
    case 'set': ui[d.k] = d.v; render(); break;
    case 'toggleSubs': ui.showSubs = !ui.showSubs; render(); break;
    case 'addTask': taskForm(null, { roomId: d.room || '' }); break;
    case 'editTask': taskForm(T()); break;
    case 'doneTask': { const t = T(); const td = todayISO(); t.prevLast = t.lastDone; t.lastDone = td; t.history.push(td); commit(); toast('Nice work'); break; }
    case 'undoTask': { const t = T(); if (t.history[t.history.length - 1] === todayISO()) t.history.pop(); t.lastDone = t.prevLast !== undefined ? t.prevLast : (t.history[t.history.length - 1] || null); delete t.prevLast; commit(); break; }
    case 'addProject': projectForm(null); break;
    case 'addSub': projectForm(null, { parentId: d.id, group: d.group || '' }); break;
    case 'editProject': projectForm(findP(d.id)); break;
    case 'addGroup': groupForm(findP(d.id), null); break;
    case 'editGroup': groupForm(findP(d.id), d.group); break;
    case 'addItem': itemForm(d.kind, d.pid); break;
    case 'editItem': itemForm(d.kind, d.pid, d.iid); break;
    case 'toggle': {
      const o = owner(d.kind, d.pid); const it = o && o[d.kind].find(x => x.id === d.iid); if (!it) break;
      it[d.field] = !it[d.field];
      if (d.kind === 'steps' && it.done && o.status === 'planning') o.status = 'in-progress';
      touch(o); commit(); break;
    }
    case 'postUpdate': postUpdate(d.pid); break;
    case 'addRoom': roomForm(null); break;
    case 'editRoom': roomForm(data.rooms.find(r => r.id === d.id)); break;
    case 'export': exportData(); break;
    case 'signOut': if (confirm('Sign out of Homebase on this device?')) signOut(auth); break;
    case 'resetPw': {
      const em = ($('#lEmail') || {}).value?.trim();
      if (!em) { $('#lErr').textContent = 'Type your email first, then tap Forgot password.'; break; }
      sendPasswordResetEmail(auth, em).then(() => { $('#lErr').textContent = 'Check your email for a reset link.'; }).catch(() => { $('#lErr').textContent = 'Could not send a reset email to that address.'; });
      break;
    }
    case 'import': $('#importFile').click(); break;
    case 'sample':
      if (hasData() && !confirm('Replace everything (for everyone) with sample data?')) break;
      data = normalize(sampleData()); commit(); location.hash = '#today'; toast('Sample data loaded'); break;
    case 'erase':
      if (confirm('Erase everything in Homebase? This erases it for everyone in your household.') && confirm("Last check — this can't be undone. Erase?")) { data = normalize({}); commit(); location.hash = '#today'; }
      break;
  }
});
function postUpdate(pid) {
  const inp = $('#updText'), p = findP(pid);
  if (!inp || !p || !inp.value.trim()) return;
  p.updates.push({ id: uid(), date: todayISO(), text: inp.value.trim() });
  if (p.status === 'planning') p.status = 'in-progress';
  touch(p); commit();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'updText') { e.preventDefault(); postUpdate(e.target.dataset.pid); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.change) { ui[e.target.dataset.change] = e.target.value; render(); }
  if (e.target.id === 'importFile' && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
});
$('#dlg').addEventListener('close', () => { formCtx = null; setTimeout(flushRender, 0); });
document.addEventListener('focusout', e => { if (e.target.id === 'updText') setTimeout(flushRender, 0); });

/* ---------- start ---------- */
function init() {
  window.addEventListener('hashchange', () => {
    closeDlg(); render();
    const { v, id } = route();
    const det = v === 'rooms' && id && document.getElementById('roomDetail');
    if (det) det.scrollIntoView({ behavior: 'smooth', block: 'start' }); else window.scrollTo(0, 0);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#dlg').open) render(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!configured) { render(); return; }
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  render();
  onAuthStateChanged(auth, u => {
    authReady = true;
    user = u;
    if (u) startSync(); else { stopSync(); data = null; syncError = ''; }
    render();
  });
}
init();
</script>
</body>
