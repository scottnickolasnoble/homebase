<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homebase</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Homebase">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#16201D; --muted:#5B6763; --soft:#4A5551;
  --line:#E2E8E5; --line2:#EDF1EF; --tint:#F8FAF9;
  --accent:#1F7A63; --accent-ink:#1F6E5A; --accent-soft:#E3F1EC;
  --warn:#A04A08; --warn-soft:#FDF0E3; --info:#2F5E9E; --info-soft:#E8EEF7; --neu:#EEF2F0;
  --danger:#B42318; --danger-soft:#FDECEA;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{flex:0 0 232px;padding:28px 16px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 24px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.bname{font-size:18px;font-weight:700;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--soft);text-decoration:none;font-weight:500;font-size:14px}
.nav:hover{background:var(--neu);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-settings{margin-top:auto}
.content{flex:1 1 auto;min-width:0;padding:36px 40px 48px;display:flex;flex-direction:column;gap:24px;max-width:1200px}
.signed-out .side{display:none}
.signed-out .content{padding-bottom:40px}

@media (max-width:760px){
  .shell{flex-direction:column}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
  .brand,.nav-settings{display:none}
  .side .nav{flex:1 1 0;flex-direction:column;justify-content:center;gap:3px;min-height:52px;padding:4px 2px;font-size:11px;text-align:center}
  .content{padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));gap:18px}
  h1{font-size:26px!important}
}

/* ---------- common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.clip{overflow:hidden}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--danger-soft);color:var(--danger)}
.p-ok{background:var(--accent-soft);color:var(--accent-ink)}
.p-neu{background:var(--neu);color:var(--soft)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-dark{background:var(--ink);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid #D5DDD9;background:#fff;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#F1C8C4}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid #D5DDD9;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);cursor:pointer;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #D5DDD9;background:#fff;font-weight:600;font-size:13px;color:var(--soft);cursor:pointer;white-space:nowrap;text-decoration:none}
.chip.on,.chip:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
.chip.soft{background:var(--accent-soft);border-color:#BFDCD1;color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mut{color:var(--muted)}
.sm-t{font-size:13px}
.num{font-family:var(--mono);font-weight:600;font-size:14px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.kicker{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
.hact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
.hd h2{font-size:17px;font-weight:700}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 20px 10px;font-size:14px;font-weight:700;border-top:1px solid var(--line);background:var(--tint)}
.grp:first-child{border-top:0}
.grp .gname{background:none;border:0;padding:0;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.bar{flex:1;height:6px;border-radius:999px;background:#E6ECE9;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.emptyline{padding:18px 20px;border-top:1px solid var(--line2);color:var(--muted);font-size:14px}
.empty{padding:28px;display:flex;flex-direction:column;gap:12px}
.empty h2{font-size:20px}
.empty p{color:var(--muted);line-height:1.55;font-size:15px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.foot{padding:12px 20px;border-top:1px solid var(--line2)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--neu)}
.seg>*{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;text-decoration:none}
.seg>*[aria-checked="true"]{background:#fff;box-shadow:0 1px 3px rgba(22,32,29,.15);color:var(--ink);font-weight:700}
.seg small{font-size:11px;font-weight:500;color:var(--muted)}

/* banner */
.banner{background:var(--ink);color:#fff;border-radius:14px;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.banner .top{display:flex;align-items:flex-start;gap:12px}
.banner p.s{margin-top:3px;font-size:13px;color:#C9D3CF;line-height:1.45}
.banner .x{color:#C9D3CF;margin:-6px -6px 0 0}
.banner .acts{padding-left:44px}
.banner .acts .btn{background:#fff;color:var(--ink);border-color:#fff;min-height:36px;font-size:13px}
.banner.due{background:var(--warn-soft);color:var(--ink);border:1px solid #F2D3B0}
.banner.due p.s{color:var(--soft)}
.banner.due .x{color:var(--soft)}
.banner.due .acts .btn{background:var(--ink);color:#fff;border-color:var(--ink)}
.dueicon{flex:none;width:30px;height:30px;border-radius:999px;background:#fff;color:var(--warn);display:inline-flex;align-items:center;justify-content:center}
.duelist{list-style:none;margin:0;padding:0 0 0 42px;display:flex;flex-direction:column;gap:6px}
.duelist li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:600}
.duelist .pill{font-size:11px;height:22px;background:#fff}

/* avatars */
.av{flex:none;width:30px;height:30px;border-radius:999px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.av-me{background:var(--accent)}
.av-other{background:var(--info)}
.av-unk{background:#9AA7A2}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:18px 20px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:block;width:100%;position:relative}
.stat:hover{border-color:#C8D2CE}
.stat .go{position:absolute;top:16px;right:16px;color:var(--muted)}
.sheetlist{border-top:1px solid var(--line2);margin:0 -20px}
.sheetlist .trow:first-child,.sheetlist .ev:first-child{border-top:0}
.stat p:first-child{font-size:13px;color:var(--muted);font-weight:500}
.stat p:last-child{margin-top:6px;font-size:28px;font-weight:700}

/* task rows */
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;border-top:1px solid var(--line2)}
.tmain{flex:1 1 220px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tname{font-size:15px;font-weight:600}
.tsub{font-size:13px;color:var(--muted)}
.tside{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdue{font-size:13px;font-weight:600}
.is-done .tname{color:var(--muted);text-decoration:line-through;font-weight:500}
.is-done{background:#FAFBFA}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{display:flex;flex-direction:column;gap:14px;padding:20px;text-decoration:none;color:var(--ink)}
.pc.big{grid-column:1/-1;border-color:#C9DDD5}
.pc.faded{background:#FAFBFA}
.pc h2{font-size:18px;font-weight:700}
.pc.big h2{font-size:20px}
.pctop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.desc{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.5;white-space:pre-line}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:14px;border-top:1px solid var(--line2)}
.ml{font-size:12px;color:var(--muted);font-weight:500}
.mv{margin-top:2px;font-size:14px;font-weight:700}
.newcard{min-height:200px;border:1.5px dashed #C8D2CE;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--soft);cursor:pointer;border-radius:14px}
.mini{display:block;padding:16px 20px;text-decoration:none;color:var(--ink)}
.mini-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;font-size:15px}
.mini .bar{margin:12px 0}

/* project detail */
.phero{padding:24px;display:flex;flex-wrap:wrap;gap:20px 24px;align-items:center;justify-content:space-between}
.phero .info{flex:1 1 320px;min-width:0}
.phero h1{font-size:28px}
.hstats{display:flex;gap:28px;flex-wrap:wrap}
.hstats p:first-child{font-size:12px;color:var(--muted);font-weight:500}
.hstats p:last-child{margin-top:2px;font-size:22px;font-weight:700}
.hstats small{font-size:15px;color:var(--muted);font-weight:600}
.fullbar{flex-basis:100%;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.back{font-size:14px;font-weight:600;text-decoration:none;align-self:flex-start;min-height:28px;display:inline-flex;align-items:center}
.step{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 20px;border-top:1px solid var(--line2)}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid #B9C4C0;background:#fff;flex:none;margin:0;appearance:none;-webkit-appearance:none;cursor:pointer;display:grid;place-items:center}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.itxt{flex:1;min-width:0;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
.done-t{color:var(--muted);text-decoration:line-through;font-weight:500}
.ms{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;min-height:48px;padding:10px 20px;border:0;border-top:1px solid var(--line2);background:none;text-align:left;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink)}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px;border-top:1px solid var(--line2)}
.prow .tmain{flex:1 1 220px}
.pmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.pillbtn{border:0;cursor:pointer}
.updform{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 16px}
.updform input{flex:1 1 220px;min-height:44px;border:1px solid #D5DDD9;border-radius:10px;padding:0 14px;font-size:15px;background:#fff}
.upd{display:flex;gap:16px;padding:14px 20px;border-top:1px solid var(--line2);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;cursor:pointer}
.upd .d{flex:none;width:64px;font-size:13px;font-weight:700;color:var(--muted)}
.upd p{font-size:14px;line-height:1.55;white-space:pre-line}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.sub .sname{flex:1 1 200px;font-size:15px;font-weight:600}
.bl{display:flex;justify-content:space-between;gap:12px;padding:10px 20px;border-top:1px solid var(--line2);font-size:14px}

/* rooms */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rc{display:flex;flex-direction:column;gap:12px;padding:18px;text-decoration:none;color:var(--ink)}
.rc.sel{border:2px solid var(--accent);padding:17px}
.rc h2{font-size:18px;font-weight:700;margin-top:2px}
.rc .fl{font-size:12px;font-weight:600;color:var(--muted)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.rsplit{display:flex;flex-wrap:wrap;border-top:1px solid var(--line)}
.rsplit>div{flex:1 1 320px;min-width:0}
.sec-h{padding:14px 20px 10px;font-size:14px;font-weight:700;background:var(--tint);border-top:1px solid var(--line)}
.rsplit>div>.sec-h:first-child{border-top:0}

/* history */
.day{padding:12px 20px 8px;font-size:12px;font-weight:700;color:var(--soft);background:var(--tint);border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.day:first-child{border-top:0}
.ev{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--line2);align-items:flex-start;text-decoration:none;color:var(--ink)}
.day+.ev{border-top:0}
.ev .et{font-size:14px;line-height:1.45}
.ev .es{margin-top:3px;font-size:12px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.kind{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600}
.split-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--neu)}
.gridcard .g{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);column-gap:4px;align-items:center;padding:7px 16px;border-top:1px solid var(--line2)}
.gridcard .gh{font-size:11px;font-weight:600;color:var(--muted);text-align:center;border-top:0;padding-top:4px;padding-bottom:8px}
.gridcard .gh span.today{background:var(--accent-soft);color:var(--ink);border-radius:7px;padding:2px 0}
.gridcard .tn{font-size:13px;font-weight:600;line-height:1.3;padding-right:6px;min-width:0}
.gridcard .ts{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.gridcard .room{padding:10px 16px 6px;font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;background:var(--tint);border-top:1px solid var(--line)}
.c{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:0;padding:0;background:#F3F6F5;color:transparent;cursor:pointer}
.c.done-me{background:var(--accent);color:#fff}
.c.done-other{background:var(--info);color:#fff}
.c.done-unk{background:#9AA7A2;color:#fff}
.c.done-dim{background:#D7DEDB;color:#fff}
.c.od{background:var(--danger-soft);box-shadow:inset 0 0 0 1.5px #E7A39C}
.c.today{background:#FFF8F0;box-shadow:inset 0 0 0 1.5px #D9A066}
.c.fut{background:transparent;cursor:default}
@media (max-width:500px){.gridcard .g{grid-template-columns:minmax(0,1fr) repeat(7,26px);column-gap:3px;padding:7px 12px}.c{width:26px;height:26px;border-radius:7px;font-size:11px}.gridcard .room{padding:10px 12px 6px}}
.nav-desk{}
@media (max-width:760px){.nav-desk{display:none!important}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px 12px 14px}
.cal-h{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-d{min-height:56px;border:0;border-radius:10px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:7px 2px 6px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.cal-d.out{opacity:.4}
.cal-d.past{color:var(--muted)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d.sel{background:var(--ink);color:#fff;box-shadow:none}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:6px;max-width:100%}
.dot{width:6px;height:6px;border-radius:999px;flex:none}
.dot.rec{background:var(--accent)} .dot.todo{background:var(--info)} .dot.proj{background:#7A5AA6} .dot.od{background:var(--danger)} .dot.done{background:#9AA7A2}
.cal-d.sel .dot.done{background:#C8D2CE}
.more{font-size:9px;font-weight:700;line-height:6px}
.calnav{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 4px}
.calnav button{width:44px;height:44px;border:0;background:none;font-size:24px;color:var(--soft);cursor:pointer;border-radius:10px}
.legend .dot{width:8px;height:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .c{width:18px;height:18px;font-size:9px;border-radius:5px;cursor:default}
.wknav{display:flex;align-items:center;justify-content:space-between;padding:8px 6px}
.wknav button{width:44px;height:44px;border:0;background:none;font-size:24px;color:var(--soft);cursor:pointer;border-radius:10px}
.wknav button:disabled{color:#C8D2CE;cursor:default}

/* dialog */
dialog{border:0;padding:0;border-radius:16px;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 48px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(22,32,29,.25)}
dialog::backdrop{background:rgba(22,32,29,.35)}
.dform{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.dhead h2{font-size:19px;font-weight:700}
.x{width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);margin-right:-10px}
.dbody{display:flex;flex-wrap:wrap;gap:14px 12px;padding:8px 20px 16px;overflow:auto}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px)}
.fld label,.flbl{font-size:13px;font-weight:600;color:var(--soft)}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid #D5DDD9;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}

<script type="module">
/* =========================================================
   Homebase — cleaning, to-dos + home projects
   Shared between household members through Firebase:
   sign in with email + password, data syncs live.
   ========================================================= */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ▼▼▼ PASTE YOUR FIREBASE CONFIG HERE (Settings → General → Your apps → Web app) ▼▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyBeQ7QRj-ZLb0zOS7RiiJnLVfBeCrNIwfA",
  authDomain: "homebase-5cd93.firebaseapp.com",
  projectId: "homebase-5cd93",
  storageBucket: "homebase-5cd93.firebasestorage.app",
  messagingSenderId: "291920905642",
  appId: "1:291920905642:web:585d43e42831af712857d3"
};
/* ▲▲▲ ------------------------------------------------------------------ ▲▲▲ */

const HOME = 'main';                                   // all household data lives under homes/main
const COLLS = ['rooms', 'tasks', 'projects', 'members'];
const configured = !String(firebaseConfig.apiKey).startsWith('PASTE');

let data = null;          // in-memory copy of everything; screens read from this
let user = null;          // signed-in Firebase user
let authReady = false;
let syncError = '';
let auth, db, unsubs = [];
const synced = Object.fromEntries(COLLS.map(c => [c, new Map()]));  // id -> JSON as last seen in the cloud
let syncedMeta = '{}';
let firstLoads = 0, pendingRender = false;
const HIST_DEFAULT = () => ({ view: 'list', range: '7', from: '', to: '', who: 'all', kinds: ['cleaning', 'todo', 'update', 'step'], room: 'all', limit: 60, week: 0 });
const ui = { taskFilter: 'all', cleanGroup: 'room', projFilter: 'all', showSubs: false, floor: 'all', hist: HIST_DEFAULT(), recentNew: new Set(), cal: { ym: '', sel: '', hideDaily: true } };

/* ---------- old on-phone storage (only used to move data into the shared copy once) ---------- */
const DB_NAME = 'homebase', STORE = 'kv';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbGet(key) {
  const idb = await openDB();
  return new Promise((res, rej) => {
    const q = idb.transaction(STORE).objectStore(STORE).get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function dbSet(key, val) {
  const idb = await openDB();
  return new Promise((res, rej) => {
    const tx = idb.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------- cloud sync ---------- */
// JSON with keys sorted, so the same item always produces the same text
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function startSync() {
  stopSync();
  data = normalize({}); firstLoads = 0; syncError = '';
  COLLS.forEach(c => synced[c].clear()); syncedMeta = '{}';
  const onErr = err => {
    console.error(err);
    syncError = err.code === 'permission-denied'
      ? `This account (${user.email}) isn't allowed into Homebase. Check the two email addresses in your Firestore rules.`
      : 'Could not reach Homebase: ' + (err.message || err.code);
    render();
  };
  COLLS.forEach(c => {
    unsubs.push(onSnapshot(collection(db, 'homes', HOME, c), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed') synced[c].delete(ch.doc.id);
        else synced[c].set(ch.doc.id, stable({ ...ch.doc.data(), id: ch.doc.id }));
      });
      data[c] = [...synced[c].entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([, js]) => JSON.parse(js));
      normalize(data);
      if (++firstLoads === COLLS.length) { ensureMember(); offerMove(); }
      scheduleRender();
    }, onErr));
  });
  unsubs.push(onSnapshot(doc(db, 'homes', HOME), s => {
    const m = s.exists() ? s.data() : {};
    syncedMeta = stable({ lastExport: m.lastExport || null });
    data.lastExport = m.lastExport || null;
    scheduleRender();
  }, onErr));
}
function stopSync() { unsubs.forEach(u => u()); unsubs = []; }
const loaded = () => firstLoads >= COLLS.length;

// Compare what's on screen with what the cloud last sent; write only the items that changed.
async function save() {
  if (!user || !db || !data || !loaded()) return;
  const ops = [];
  for (const c of COLLS) {
    const cur = new Map(data[c].map(o => [o.id, stable(o)]));
    for (const [id, js] of cur) if (synced[c].get(id) !== js) ops.push(['set', doc(db, 'homes', HOME, c, id), JSON.parse(js)]);
    for (const id of synced[c].keys()) if (!cur.has(id)) ops.push(['del', doc(db, 'homes', HOME, c, id)]);
    synced[c] = cur;
  }
  const meta = stable({ lastExport: data.lastExport || null });
  if (meta !== syncedMeta) { ops.push(['set', doc(db, 'homes', HOME), JSON.parse(meta)]); syncedMeta = meta; }
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db);
      ops.slice(i, i + 400).forEach(([kind, ref, val]) => kind === 'set' ? b.set(ref, val) : b.delete(ref));
      await b.commit();
    }
  } catch (e) { console.error(e); toast("Couldn't save — check your connection"); }
}
function commit() { save(); render(); }

// Live updates from the other phone: wait if a form is open or an update is being typed.
function scheduleRender() {
  const a = document.activeElement;
  if (($('#dlg').open && !statOpen) || (a && a.id === 'updText' && a.value)) { pendingRender = true; return; }
  render();
}
function flushRender() { if (pendingRender) { pendingRender = false; render(); } }

// One time: if this phone has data from before sharing, offer to move it in.
async function offerMove() {
  if (hasData()) return;
  let raw = null;
  try { raw = await dbGet('data'); } catch { return; }
  if (!raw) return;
  let old; try { old = JSON.parse(raw); } catch { return; }
  const n = (old.rooms || []).length + (old.tasks || []).length + (old.projects || []).length;
  if (!n) return;
  if (confirm(`Found Homebase data saved on this phone from before sharing (${n} items).\n\nMove it into your shared Homebase?`)) {
    data = normalize({ ...old, members: data.members }); commit(); toast('Moved into shared Homebase');
  }
  try { await dbSet('data', ''); } catch {}
}

/* ---------- people ---------- */
const me = () => user ? user.uid : '';
const nowISO = () => new Date().toISOString();
const myMember = () => data.members.find(m => m.id === me());
function personName(uid, { you = 'You' } = {}) {
  if (!uid) return null;
  if (uid === me()) return you;
  const m = data.members.find(x => x.id === uid);
  return (m && m.name) || 'Your partner';
}
function initial(uid) {
  if (!uid) return '✓';
  const m = data.members.find(x => x.id === uid);
  return ((m && m.name) || (uid === me() ? 'Y' : '?')).trim().charAt(0).toUpperCase() || '?';
}
const avCls = uid => !uid ? 'av-unk' : uid === me() ? 'av-me' : 'av-other';
const avatar = uid => `<span class="av ${avCls(uid)}" aria-hidden="true">${esc(initial(uid))}</span>`;
function ensureMember() {
  if (!user) return;
  let m = myMember();
  if (!m) { m = { id: me(), email: user.email, name: '', seenAt: nowISO() }; data.members.push(m); save(); }
  if (!m.seenAt) { m.seenAt = nowISO(); save(); }
  if (!m.name) setTimeout(() => { if (!$('#dlg').open) nameForm(true); }, 300);
}
function nameForm(first) {
  const m = myMember(); if (!m) return;
  openForm({
    title: first ? 'What should we call you?' : 'Your name',
    fields: [{ key: 'name', label: 'First name', required: true, placeholder: 'Your first name' }],
    values: { name: m.name || '' },
    extra: '<p class="hint">Shows in History and on the "new to-do" banner on the other phone.</p>',
    onSave: v => { m.name = v.name; },
  });
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
let lastT = 0;   // ids sort in the order things were created
const uid = () => { let t = Date.now(); if (t <= lastT) t = lastT + 1; lastT = t; return t.toString(36) + Math.random().toString(36).slice(2, 7); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const dayOf = at => iso(new Date(at));                   // local date of a timestamp
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const relDate = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmt(s) {
  if (!s) return '—';
  const d = parseD(s);
  const y = d.getFullYear() !== new Date().getFullYear() ? `, ${d.getFullYear()}` : '';
  return `${MON[d.getMonth()]} ${d.getDate()}${y}`;
}
const fmtTime = at => at ? new Date(at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase() : '';
function dayLabel(d) {
  const diff = daysBetween(d, todayISO());
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  const dt = parseD(d);
  return diff < 7 && diff > 0 ? `${WD[dt.getDay()]}, ${fmt(d)}` : `${WD[dt.getDay()].slice(0, 3)}, ${fmt(d)}`;
}
function addEvery(s, ev) {
  const d = parseD(s), n = Math.max(1, +ev.n || 1);
  if (ev.unit === 'day') d.setDate(d.getDate() + n);
  else if (ev.unit === 'week') d.setDate(d.getDate() + 7 * n);
  else if (ev.unit === 'month') {
    const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  } else d.setFullYear(d.getFullYear() + n);
  return iso(d);
}
const UNIT = { day: ['Daily', 'day'], week: ['Weekly', 'week'], month: ['Monthly', 'month'], year: ['Yearly', 'year'] };
function everyText(ev) {
  const n = Math.max(1, +ev.n || 1), u = UNIT[ev.unit] || UNIT.week;
  return n === 1 ? u[0] : `Every ${n} ${u[1]}s`;
}
const isOneoff = t => t.type === 'oneoff';
const nextDue = t => isOneoff(t) ? (t.due || null) : (t.lastDone ? addEvery(t.lastDone, t.every) : todayISO());
// Overdue = red, due today = amber, due within 3 days = blue, later or no date = grey (done today = green)
function dueInfo(t) {
  const due = nextDue(t);
  if (!due) return { d: Infinity, cls: 'neu', label: 'No date' };
  const d = daysBetween(todayISO(), due);
  if (d < 0) return { d, cls: 'bad', label: d === -1 ? 'Overdue · 1 day' : `Overdue · ${-d} days` };
  if (d === 0) return { d, cls: 'warn', label: 'Due today' };
  if (d === 1) return { d, cls: 'info', label: 'Due tomorrow' };
  if (d <= 3) return { d, cls: 'info', label: `Due soon · ${d} days` };
  return { d, cls: 'neu', label: `In ${d} days` };
}
const doneToday = t => isOneoff(t) ? (t.done && t.doneAt && dayOf(t.doneAt) === todayISO()) : t.lastDone === todayISO();
const isOpen = t => isOneoff(t) ? !t.done : true;
const money = n => '$' + (+n || 0).toLocaleString('en-CA', { minimumFractionDigits: (+n % 1 ? 2 : 0), maximumFractionDigits: 2 });
const roomName = id => (data.rooms.find(r => r.id === id) || {}).name || '';
const roomOptions = () => [['', 'No room'], ...data.rooms.map(r => [r.id, r.name])];
const pill = (label, cls) => `<span class="pill p-${cls}">${esc(label)}</span>`;
const bar = (pct, h = 6) => `<div class="bar" style="height:${h}px"><span style="width:${pct}%"></span></div>`;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function upcomingSaturday() {
  const d = new Date(); const wd = d.getDay();
  if (wd === 6 || wd === 0) return iso(d);
  d.setDate(d.getDate() + (6 - wd)); return iso(d);
}

/* ---------- new to-do banner ---------- */
function newTodos() {
  const m = myMember(); if (!m || !m.seenAt) return [];
  return data.tasks.filter(t => isOneoff(t) && !t.done && t.createdBy && t.createdBy !== me() && (t.createdAt || '') > m.seenAt);
}
const isNew = t => ui.recentNew.has(t.id) || newTodos().includes(t);
function markSeen() {
  const m = myMember(); if (!m) return;
  newTodos().forEach(t => ui.recentNew.add(t.id));
  m.seenAt = nowISO();
  commit();
}
/* ---------- "coming up" banner: long-interval recurring tasks ---------- */
// How many days ahead to start reminding: a week for monthly-or-longer jobs, 3 days for 2–3 week ones
function leadDays(t) {
  const n = +t.every.n || 1, u = t.every.unit;
  return (u === 'month' || u === 'year' || (u === 'week' && n >= 4) || (u === 'day' && n >= 28)) ? 7 : 3;
}
function isLongInterval(t) {   // repeats every 2 weeks or longer
  if (isOneoff(t)) return false;
  const n = +t.every.n || 1;
  return t.every.unit === 'year' || t.every.unit === 'month' || (t.every.unit === 'week' && n >= 2) || (t.every.unit === 'day' && n >= 14);
}
function comingDue() {
  const m = myMember(), dismissed = (m && m.dueDismissed) || {};
  return data.tasks.filter(t => isLongInterval(t) && !doneToday(t))
    .filter(t => { const d = dueInfo(t).d; return d >= 0 && d <= leadDays(t) && dismissed[t.id] !== nextDue(t); })
    .sort((a, b) => nextDue(a).localeCompare(nextDue(b)));
}
function dismissComingDue() {
  const m = myMember(); if (!m) return;
  const keep = {};
  Object.entries(m.dueDismissed || {}).forEach(([id, due]) => { const t = data.tasks.find(x => x.id === id); if (t && nextDue(t) === due) keep[id] = due; });
  comingDue().forEach(t => { keep[t.id] = nextDue(t); });
  m.dueDismissed = keep;
  commit();
}
function dueBannerHTML() {
  const list = comingDue(); if (!list.length) return '';
  const when = t => { const di = dueInfo(t); return di.d === 0 ? 'Due today' : di.d === 1 ? 'Due tomorrow' : `Due ${WD[parseD(nextDue(t)).getDay()].slice(0, 3)}, ${fmt(nextDue(t))}`; };
  return `<section class="banner due" role="status" aria-label="Coming up">
    <div class="top"><span class="dueicon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
      <div style="flex:1;min-width:0"><p style="font-size:14px;font-weight:700">Coming up ${list.length === 1 ? '' : `· ${list.length} tasks`}</p>
      <p class="s">Bigger jobs that don't come around often</p></div>
      <button class="x" data-act="dismissDue" aria-label="Dismiss">×</button></div>
    <ul class="duelist">${list.slice(0, 4).map(t => `<li><span style="min-width:0">${esc(t.name)}<span class="mut" style="font-weight:500;font-size:12px;display:block">${esc(everyText(t.every))}${roomName(t.roomId) ? ' · ' + esc(roomName(t.roomId)) : ''}</span></span>${pill(when(t), dueInfo(t).cls)}</li>`).join('')}${list.length > 4 ? `<li class="mut" style="font-weight:500">+${list.length - 4} more</li>` : ''}</ul>
    <div class="acts"><button class="btn" data-act="viewDue">View tasks</button></div>
  </section>`;
}

function bannerHTML() {
  const nt = newTodos(); if (!nt.length) return '';
  const by = [...new Set(nt.map(t => t.createdBy))];
  const who = by.length === 1 ? personName(by[0]) : 'Your household';
  return `<section class="banner" role="status" aria-label="New to-dos">
    <div class="top">${by.length === 1 ? avatar(by[0]) : avatar(null)}
      <div style="flex:1;min-width:0"><p style="font-size:14px;font-weight:700">${esc(who)} added ${nt.length === 1 ? 'a new to-do' : nt.length + ' new to-dos'}</p>
      <p class="s">${esc(nt.slice(0, 3).map(t => t.name).join(' · '))}${nt.length > 3 ? ' · …' : ''}</p></div>
      <button class="x" data-act="dismissBanner" aria-label="Dismiss">×</button></div>
    <div class="acts"><button class="btn" data-act="viewNew">View to-do${nt.length === 1 ? '' : 's'}</button></div>
  </section>`;
}

/* ---------- projects ---------- */
const STATUS = { planning: ['Planning', 'info'], 'in-progress': ['In progress', 'ok'], waiting: ['Waiting on parts', 'warn'], done: ['Done', 'neu'] };
const STATUS_OPTS = Object.entries(STATUS).map(([k, v]) => [k, v[0]]);
const isBig = p => p.kind === 'big';
const kids = p => data.projects.filter(c => c.parentId === p.id);
const findP = id => data.projects.find(p => p.id === id);
const statusPill = p => pill((STATUS[p.status] || STATUS.planning)[0], (STATUS[p.status] || STATUS.planning)[1]);
function progress(p) {
  if (isBig(p)) {
    const k = kids(p);
    return k.length ? Math.round(k.reduce((a, c) => a + progress(c), 0) / k.length) : (p.status === 'done' ? 100 : 0);
  }
  if (p.status === 'done') return 100;
  const s = p.steps || [];
  return s.length ? Math.round(s.filter(x => x.done).length / s.length * 100) : 0;
}
function spent(p) {
  if (isBig(p)) return kids(p).reduce((a, c) => a + spent(c), 0);
  return p.parts.filter(x => x.have).reduce((a, x) => a + (+x.cost || 0), 0);
}
function lastUpdated(p) {
  const dates = [p.updatedAt, ...(isBig(p) ? kids(p).map(lastUpdated) : [])].filter(Boolean).sort();
  return dates[dates.length - 1] || null;
}
function touch(p) {
  if (!p || !p.id || p.info) return;
  p.updatedAt = todayISO();
  if (p.parentId) { const par = findP(p.parentId); if (par) par.updatedAt = todayISO(); }
}
function groupList(p) {
  const g = [...p.groups];
  kids(p).forEach(c => { if (c.group && !g.includes(c.group)) g.push(c.group); });
  if (kids(p).some(c => !c.group)) g.push('');
  return g;
}

/* ---------- data shape ---------- */
function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  d.version = 2; delete d.savedAt;
  COLLS.forEach(c => { d[c] = Array.isArray(d[c]) ? d[c] : []; });
  d.rooms.forEach(r => { r.id = r.id || uid(); r.name = r.name || 'Room'; r.info = Array.isArray(r.info) ? r.info : []; });
  d.tasks.forEach(t => {
    t.id = t.id || uid(); t.name = t.name || 'Task';
    t.type = t.type === 'oneoff' ? 'oneoff' : 'recurring';
    if (t.type === 'recurring') {
      t.every = t.every && UNIT[t.every.unit] ? t.every : { n: 1, unit: 'week' };
      t.history = Array.isArray(t.history) ? t.history : [];
      t.log = Array.isArray(t.log) ? t.log : [];
    } else {
      t.done = !!t.done;
    }
  });
  d.projects.forEach(p => {
    p.id = p.id || uid(); p.name = p.name || 'Project';
    p.kind = p.kind === 'big' ? 'big' : 'regular';
    p.status = STATUS[p.status] ? p.status : 'planning';
    ['steps', 'measurements', 'parts', 'updates', 'quick', 'groups'].forEach(k => { p[k] = Array.isArray(p[k]) ? p[k] : []; });
  });
  return d;
}
const hasData = () => data.tasks.length || data.projects.length || data.rooms.length;

/* ---------- router ---------- */

const gearBtn = `<a class="iconbtn" href="#settings" aria-label="Settings and backup"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>`;

/* ---------- task rows ---------- */
function doneByText(t) {
  if (isOneoff(t)) return t.doneBy ? `Done by ${personName(t.doneBy, { you: 'you' })}${t.doneAt ? ', ' + fmtTime(t.doneAt) : ''}` : 'Done';

}
function taskRow(t, showRoom = true) {
  const room = showRoom && roomName(t.roomId) ? ' · ' + esc(roomName(t.roomId)) : '';
  if (isOneoff(t)) {

  const di = dueInfo(t), dt = doneToday(t);

  const sub = dt ? esc(everyText(t.every)) + room + ' · ' + esc(doneByText(t)) : esc(everyText(t.every)) + room + last;
  const side = dt
    ? `${pill('Done today', 'ok')}<button class="chip" data-act="undoTask" data-id="${t.id}">Undo</button>`

function miniProject(p) {
  const pr = progress(p), parent = p.parentId && findP(p.parentId);

}

/* ---------- Tasks ---------- */
function vTasks() {
  const todos = data.tasks.filter(t => isOneoff(t) && (!t.done || doneToday(t)));
  const openTodos = todos.filter(t => !t.done);
  todos.sort((a, b) => (a.done - b.done) || ((a.due || '9999') .localeCompare(b.due || '9999')) || a.id.localeCompare(b.id));
  const rec = data.tasks.filter(t => !isOneoff(t));
  const overdueN = data.tasks.filter(t => isOpen(t) && dueInfo(t).d < 0).length;
  const f = ui.taskFilter;
  const chip = (v, l) => `<button class="chip${f === v ? ' on' : ''}" data-act="set" data-k="taskFilter" data-v="${v}">${l}</button>`;
  const showTodo = f === 'all' || f === 'todo' || f === 'overdue';
  const showRec = f === 'all' || f === 'recurring' || f === 'overdue';
  let todoList = todos, recList = [...rec];
  if (f === 'overdue') { todoList = todos.filter(t => !t.done && dueInfo(t).d < 0); recList = rec.filter(t => dueInfo(t).d < 0); }
  recList.sort((a, b) => nextDue(a).localeCompare(nextDue(b)) || a.name.localeCompare(b.name));

  let groups = [];
  if (ui.cleanGroup === 'room') {
    groups = data.rooms.map(r => [r.name, recList.filter(t => t.roomId === r.id)]);
    groups.push(['No room', recList.filter(t => !data.rooms.some(r => r.id === t.roomId))]);
  } else {
    groups = [
      ['Overdue', recList.filter(t => dueInfo(t).d < 0)],
      ['Today', recList.filter(t => dueInfo(t).d === 0)],
      ['This week', recList.filter(t => dueInfo(t).d > 0 && dueInfo(t).d <= 6)],
      ['Later', recList.filter(t => dueInfo(t).d > 6)],
    ];
  }
  groups = groups.filter(g => g[1].length);

  const todoCard = showTodo && (f !== 'overdue' || todoList.length) ? `<section class="card clip">
    <div class="hd"><h2>To-dos <span class="mut" style="font-size:13px;font-weight:600">· one-off</span></h2><button class="btn sm" data-act="addTask" data-type="oneoff">+ To-do</button></div>
    ${todoList.map(t => taskRow(t)).join('') || '<p class="emptyline">No to-dos. Add one-off jobs here — they disappear once done (and stay in History).</p>'}
    ${todoList.some(t => t.done) ? '<p class="emptyline sm-t" style="font-size:12px">Finished to-dos drop off after today and stay in History.</p>' : ''}
  </section>` : '';
  const recCard = showRec ? `<section class="card clip">
    <div class="hd" style="flex-wrap:wrap"><h2>Recurring</h2>
      <label class="sm-t" style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--soft)">Group by
        <select data-change="cleanGroup" style="min-height:36px;border-radius:8px;border:1px solid #D5DDD9;padding:0 10px;background:#fff;font-size:14px">
          <option value="room"${ui.cleanGroup === 'room' ? ' selected' : ''}>Room</option>
          <option value="due"${ui.cleanGroup === 'due' ? ' selected' : ''}>Due date</option>
        </select></label></div>
    ${groups.length ? groups.map(([name, ts]) => `<h3 class="grp"><span>${esc(name)} <span class="mut" style="font-weight:500">· ${ts.length}</span></span></h3>${ts.map(t => taskRow(t, ui.cleanGroup !== 'room')).join('')}`).join('')
      : `<p class="emptyline">${rec.length ? 'Nothing matches this filter.' : 'No recurring tasks yet. Add cleaning and chores that repeat.'}</p>`}
  </section>` : '';
  return head(`${openTodos.length} to-do${openTodos.length === 1 ? '' : 's'} · ${rec.length} recurring`, 'Tasks', `<button class="btn pri" data-act="addTask">+ Task</button>`) + `
  <div class="chips">${chip('all', 'All')}${chip('todo', `To-dos · ${openTodos.length}`)}${chip('recurring', 'Recurring')}${chip('overdue', `Overdue · ${overdueN}`)}</div>
  ${todoCard}${recCard}
  <p class="sm-t mut">Tap a task to edit it, see its notes and when it was done.</p>`;
}
function taskForm(t, preset = {}) {

  const one = type === 'oneoff';
  const v = t ? { name: t.name, roomId: t.roomId || '', notes: t.notes || '', ...(one ? { due: t.due || '' } : { n: t.every.n, unit: t.every.unit, lastDone: t.lastDone || '' }) }
              : { name: preset.name || '', roomId: preset.roomId || '', notes: preset.notes || '', n: 1, unit: 'week', lastDone: '', due: preset.due ?? todayISO() };
  const seg = isNew ? `<div class="seg" role="radiogroup" aria-label="Task type" style="flex:1 1 100%">

    { key: 'lastDone', label: 'Last done (leave blank if never)', type: 'date' });
  fields.push({ key: 'roomId', label: 'Room', type: 'select', options: roomOptions() }, { key: 'notes', label: one ? 'Notes' : 'Notes — supplies, how-to', type: 'textarea' });
  let extra = '';
  if (one) {
    extra = `<div class="chips" style="flex:1 1 100%;margin-top:-6px" aria-label="Quick due dates">
      <button type="button" class="chip" data-setdue="${todayISO()}">Today</button><button type="button" class="chip" data-setdue="${relDate(1)}">Tomorrow</button>

    if (isNew && data.members.some(m => m.id !== me())) extra += `<p class="hint">${esc(data.members.filter(m => m.id !== me()).map(m => m.name || 'Your partner').join(' and '))} will see a "new to-do" banner next time they open Homebase.</p>`;

  openForm({

    saveLabel: isNew ? (one ? 'Add to-do' : 'Add task') : 'Save',
    onSave: x => {
      if (one) {
        const o = { name: x.name, roomId: x.roomId, notes: x.notes, due: x.due || '' };
        if (isNew) data.tasks.push({ id: uid(), type: 'oneoff', done: false, createdAt: nowISO(), createdBy: me(), ...o });
        else Object.assign(t, o);
      } else {
        const o = { name: x.name, roomId: x.roomId, every: { n: Math.max(1, Math.round(x.n || 1)), unit: x.unit }, lastDone: x.lastDone || null, notes: x.notes };

/* ---------- Projects ---------- */

function projectForm(p, preset = {}) {
  const isNew = !p;

  const bigs = data.projects.filter(x => isBig(x) && (!p || x.id !== p.id));
  const allGroups = [...new Set(data.projects.flatMap(x => x.groups))];
  const v = p ? { ...p, partOf: p.parentId || '', group: p.group || '' }
              : { name: '', kind: 'regular', status: 'planning', roomId: '', description: '', budget: null, startDate: todayISO(), targetDate: '', partOf: parentId || '', group: preset.group || '' };
  const showKind = !(p && p.parentId) && !parentId;
  const fields = [{ key: 'name', label: parentId ? 'Sub-project' : 'Project', required: true, placeholder: parentId ? 'Patch hallway drywall' : 'Basement shelving' }];
  if (showKind) fields.push({ key: 'kind', label: 'Type', type: 'select', options: [['regular', 'Regular project'], ['big', 'Big project (holds sub-projects)']] });
  if (!(p && isBig(p)) && bigs.length) {

  }
  fields.push(
    { key: 'status', label: 'Status', type: 'select', options: STATUS_OPTS, half: true },
    { key: 'roomId', label: 'Room', type: 'select', options: roomOptions(), half: true },
    { key: 'budget', label: 'Budget ($)', type: 'number', min: 0, half: true },
    { key: 'startDate', label: 'Started', type: 'date', half: true },
    { key: 'targetDate', label: 'Target date', type: 'date' },
    { key: 'description', label: 'Description / notes', type: 'textarea' });
  openForm({
    title: isNew ? (parentId ? 'New sub-project' : 'New project') : 'Edit project',
    fields, values: v,
    onSave: x => {

/* ---------- Schedule (calendar) ---------- */
const isDaily = t => !isOneoff(t) && t.every.unit === 'day' && (+t.every.n || 1) <= 1;
// What lands on each day between from and to (inclusive). Today onward: what's due (recurring tasks
// are projected forward on their schedule). Days before today: what got done.
function calendarItems(from, to) {
  const today = todayISO(), map = {};
  const put = (d, item) => { if (d >= from && d <= to) (map[d] = map[d] || []).push(item); };
  data.tasks.forEach(t => {
    if (ui.cal.hideDaily && isDaily(t)) return;
    if (isOneoff(t)) {
      if (t.done) { if (doneToday(t)) put(today, { t, type: 'todo', done: true }); return; }
      if (t.due) put(t.due < today ? today : t.due, { t, type: 'todo', od: t.due < today, next: true });
      return;
    }
    if (doneToday(t)) put(today, { t, type: 'rec', done: true });
    let cur = nextDue(t);
    if (cur < today) { put(today, { t, type: 'rec', od: true, next: true }); cur = addEvery(today, t.every); }
    else { put(cur, { t, type: 'rec', next: true }); cur = addEvery(cur, t.every); }
    for (let i = 0; i < 400 && cur <= to; i++) { put(cur, { t, type: 'rec' }); cur = addEvery(cur, t.every); }
  });
  data.projects.forEach(p => { if (p.targetDate && p.status !== 'done' && p.targetDate >= today) put(p.targetDate, { p, type: 'proj' }); });
  events().forEach(e => {
    if (e.d >= today || !(e.kind === 'cleaning' || (e.kind === 'todo' && e.done))) return;
    if (ui.cal.hideDaily && e.kind === 'cleaning' && data.tasks.some(t => t.name === e.what && isDaily(t))) return;
    put(e.d, { e, type: 'past' });
  });
  return map;
}
function vSchedule() {
  const today = todayISO();
  if (!ui.cal.ym) ui.cal.ym = today.slice(0, 7);
  if (!ui.cal.sel) ui.cal.sel = today;
  const [y, m] = ui.cal.ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay());
  const lastOfMonth = new Date(y, m, 0);
  const weeks = Math.ceil((first.getDay() + lastOfMonth.getDate()) / 7);
  const days = [...Array(weeks * 7)].map((_, i) => iso(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i)));
  const map = calendarItems(days[0], days[days.length - 1]);
  const dotCls = it => it.type === 'past' || it.done ? 'done' : it.od ? 'od' : it.type;
  const cells = days.map(d => {
    const items = map[d] || [], inMonth = d.slice(0, 7) === ui.cal.ym;
    const cls = ['cal-d', inMonth ? '' : 'out', d < today ? 'past' : '', d === today ? 'today' : '', d === ui.cal.sel ? 'sel' : ''].filter(Boolean).join(' ');
    const dots = items.slice(0, 4).map(it => `<span class="dot ${dotCls(it)}"></span>`).join('') + (items.length > 4 ? `<span class="more">+${items.length - 4}</span>` : '');
    const label = `${WD[parseD(d).getDay()]} ${fmt(d)}: ${items.length ? items.length + (d < today ? ' done' : ' due') : 'nothing'}`;
    return `<button class="${cls}" data-act="calDay" data-v="${d}" aria-label="${esc(label)}"${d === ui.cal.sel ? ' aria-pressed="true"' : ''}>${parseD(d).getDate()}<span class="dots">${dots}</span></button>`;
  }).join('');
  const monthName = first.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });

  // the selected day
  const sel = ui.cal.sel, selItems = (calendarItems(sel, sel)[sel] || []);
  const selDate = parseD(sel);
  const selLabel = sel === today ? 'Today' : daysBetween(today, sel) === 1 ? 'Tomorrow' : `${WD[selDate.getDay()]}, ${fmt(sel)}`;
  let list = '';
  if (sel < today) {
    list = selItems.map(it => evRow(it.e)).join('') || '<p class="emptyline" style="border:0">Nothing was marked done this day.</p>';
  } else {
    const rows = selItems.sort((a, b) => (b.od ? 1 : 0) - (a.od ? 1 : 0) || (a.done ? 1 : 0) - (b.done ? 1 : 0));
    list = rows.map(it => {
      if (it.type === 'proj') { const pr = progress(it.p); return `<a class="ms" href="#project/${it.p.id}"><span style="min-width:0"><span style="font-weight:600;display:block">${esc(it.p.name)}</span><span class="mut" style="font-size:12px">Project target date · ${pr}% done</span></span>${pill('Target', 'neu')}</a>`; }
      if (it.next || it.done) return taskRow(it.t);
      return `<div class="trow"><button class="tmain" data-act="editTask" data-id="${it.t.id}"><span class="tname">${esc(it.t.name)}</span><span class="tsub">${esc(everyText(it.t.every))}${roomName(it.t.roomId) ? ' · ' + esc(roomName(it.t.roomId)) : ''} · if done on schedule</span></button><div class="tside">${pill('Repeats', 'neu')}</div></div>`;
    }).join('') || '<p class="emptyline" style="border:0">Nothing due this day.</p>';
  }
  const dailyN = data.tasks.filter(isDaily).length;
  return `<a class="back" href="#today">← Today</a>` + head('What\'s due, day by day', 'Schedule', `<button class="btn pri" data-act="calAdd">+ To-do</button>`) + `
  <section class="card clip">
    <div class="calnav"><button data-act="calMonth" data-v="-1" aria-label="Previous month">‹</button>
      <div style="text-align:center"><p style="font-size:16px;font-weight:700">${esc(monthName)}</p>${ui.cal.ym !== today.slice(0, 7) ? '<button class="chip" data-act="calToday" style="min-height:28px;margin-top:4px;font-size:12px">Back to today</button>' : ''}</div>
      <button data-act="calMonth" data-v="1" aria-label="Next month">›</button></div>
    <div class="cal" role="grid" aria-label="${esc(monthName)}">${'SMTWTFS'.split('').map(c => `<span class="cal-h" aria-hidden="true">${c}</span>`).join('')}${cells}</div>
    <div class="legend"><span><span class="dot rec"></span>Recurring</span><span><span class="dot todo"></span>To-do</span><span><span class="dot od"></span>Overdue</span><span><span class="dot proj"></span>Project target</span><span><span class="dot done"></span>Done</span></div>
  </section>
  ${dailyN ? `<label class="sm-t" style="display:flex;align-items:center;gap:10px;font-weight:600;color:var(--soft);min-height:36px;cursor:pointer"><input type="checkbox" class="chk" data-act="calDaily"${ui.cal.hideDaily ? '' : ' checked'}> Show daily tasks (${dailyN}) on the calendar</label>` : ''}
  <section class="card clip" id="calDayList">
    <div class="hd"><h2>${esc(selLabel)}${sel === today || daysBetween(today, sel) === 1 ? `<span class="mut" style="font-size:13px;font-weight:500"> · ${esc(fmt(sel))}</span>` : ''}</h2>${sel >= today ? `<button class="btn sm" data-act="calAdd">+ To-do this day</button>` : ''}</div>
    ${list}
  </section>`;
}

async function exportData() {
  const json = JSON.stringify(data, null, 2);
  const name = `homebase-backup-${todayISO()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  const mark = () => { data.lastExport = nowISO(); commit(); toast('Backup saved'); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Homebase backup' });
      mark(); return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  mark();
}
async function importFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { alert("That file isn't a Homebase backup (couldn't read it)."); return; }
  if (!obj || !Array.isArray(obj.tasks) || !Array.isArray(obj.projects) || !Array.isArray(obj.rooms)) { alert("That file isn't a Homebase backup."); return; }
  if (hasData() && !confirm(`Replace everything in Homebase (for everyone) with this backup?\n\n${obj.rooms.length} rooms · ${obj.tasks.length} tasks · ${obj.projects.length} projects`)) return;
  data = normalize({ ...obj, members: data.members });
  commit(); location.hash = '#today'; toast('Backup restored');
}

  else if (t === 'textarea') input = `<textarea id="${id}" name="${f.key}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(v ?? '')}</textarea>`;
  else {
    const list = f.list ? ` list="dl_${f.key}"` : '';

  const byDue = (a, b) => (nextDue(a) || '').localeCompare(nextDue(b) || '');
  let title, body;
  if (kind === 'today') {
    const list = open.filter(x => dueInfo(x).d === 0).sort(byDue), done = data.tasks.filter(doneToday);

document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); doLogin(e.target); return; }
  if (e.target.id === 'hform') {
    e.preventDefault();
    const v = readFilterForm(e.target);
    if (!v.kinds.length) v.kinds = HIST_DEFAULT().kinds;
    Object.assign(ui.hist, v, { limit: 60 });
    closeDlg(); render(); return;
  }
  if (e.target.id !== 'dform') return;
  e.preventDefault();
  const cfg = formCtx, fm = e.target, vals = {};
  if (!cfg) return;
  for (const f of cfg.fields) {
    const el = fm.elements[f.key];
    if (f.type === 'checkbox') vals[f.key] = el.checked;
    else if (f.type === 'number') vals[f.key] = el.value === '' ? null : Number(el.value);
    else vals[f.key] = el.value.trim();
  }
  const miss = cfg.fields.find(f => f.required && !vals[f.key]);
  if (miss) { const el = fm.elements[miss.key]; el.classList.add('bad'); el.focus(); return; }
  cfg.onSave(vals);
  closeDlg(); commit();
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeDlg(); return; }
  if (e.target.closest('[data-del]')) {
    const cfg = formCtx;
    if (cfg && confirm(cfg.deleteMsg || "Delete this? This can't be undone.")) { cfg.onDelete(); closeDlg(); commit(); }
    return;
  }
  const tt = e.target.closest('[data-ttype]');
  if (tt) {   // switch Repeats / One-off in the new-task form, keeping what was typed
    const fm = $('#dform');
    const keep = { name: fm.elements.name.value, roomId: fm.elements.roomId.value, notes: fm.elements.notes.value, type: tt.dataset.ttype };
    taskForm(null, keep); return;
  }
  const sd = e.target.closest('[data-setdue]');
  if (sd) { const inp = $('#f_due'); if (inp) inp.value = sd.dataset.setdue; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, T = () => data.tasks.find(x => x.id === d.id);
  switch (d.act) {
    case 'set': ui[d.k] = d.v; render(); break;
    case 'toggleSubs': ui.showSubs = !ui.showSubs; render(); break;

    case 'editTask': taskForm(T()); break;
    case 'doneTask': {
      const t = T(); const td = todayISO();
      t.prevLast = t.lastDone; t.lastDone = td; t.history.push(td); t.log.push({ d: td, at: nowISO(), by: me() });
      commit(); toast('Nice work'); break;
    }
    case 'undoTask': {
      const t = T(); const td = todayISO();
      if (t.history[t.history.length - 1] === td) t.history.pop();
      const li = t.log.map(x => x.d).lastIndexOf(td); if (li >= 0) t.log.splice(li, 1);
      t.lastDone = t.prevLast !== undefined ? t.prevLast : ([...t.history].sort().pop() || null); delete t.prevLast;
      commit(); break;
    }
    case 'toggleTodo': {
      const t = T(); t.done = !t.done;
      t.doneAt = t.done ? nowISO() : null; t.doneBy = t.done ? me() : null;
      commit(); if (t.done) toast('Nice work'); break;
    }
    case 'dismissBanner': markSeen(); break;
    case 'viewNew': markSeen(); ui.taskFilter = 'todo'; location.hash = '#tasks'; break;
    case 'dismissDue': dismissComingDue(); break;
    case 'statSheet': openStatSheet(d.v); break;
    case 'calDay': {
      ui.cal.sel = d.v; if (d.v.slice(0, 7) !== ui.cal.ym) ui.cal.ym = d.v.slice(0, 7);
      render();
      const l = $('#calDayList'); if (l && l.getBoundingClientRect().top > innerHeight * 0.6) l.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'calMonth': { const [yy, mm] = ui.cal.ym.split('-').map(Number); const n = new Date(yy, mm - 1 + Number(d.v), 1); ui.cal.ym = iso(n).slice(0, 7); render(); break; }
    case 'calToday': ui.cal.ym = todayISO().slice(0, 7); ui.cal.sel = todayISO(); render(); break;
    case 'calDaily': ui.cal.hideDaily = !ui.cal.hideDaily; render(); break;
    case 'calAdd': taskForm(null, { type: 'oneoff', due: ui.cal.sel && ui.cal.sel >= todayISO() ? ui.cal.sel : todayISO() }); break;
    case 'viewDue': dismissComingDue(); ui.taskFilter = 'recurring'; ui.cleanGroup = 'due'; location.hash = '#tasks'; break;
    case 'addProject': projectForm(null); break;
    case 'addSub': projectForm(null, { parentId: d.id, group: d.group || '' }); break;
    case 'editProject': projectForm(findP(d.id)); break;
    case 'addGroup': groupForm(findP(d.id), null); break;
    case 'editGroup': groupForm(findP(d.id), d.group); break;
    case 'addItem': itemForm(d.kind, d.pid); break;
    case 'editItem': itemForm(d.kind, d.pid, d.iid); break;
    case 'toggle': {
      const o = owner(d.kind, d.pid); const it = o && o[d.kind].find(x => x.id === d.iid); if (!it) break;
      it[d.field] = !it[d.field];
      if (d.kind === 'steps') { it.doneAt = it.done ? nowISO() : null; it.doneBy = it.done ? me() : null; }
      if (d.kind === 'parts') { it.haveAt = it.have ? nowISO() : null; it.haveBy = it.have ? me() : null; }
      if (d.kind === 'steps' && it.done && o.status === 'planning') o.status = 'in-progress';
      touch(o); commit(); break;
    }
    case 'postUpdate': postUpdate(d.pid); break;
    case 'addRoom': roomForm(null); break;
    case 'editRoom': roomForm(data.rooms.find(r => r.id === d.id)); break;
    case 'histView': ui.hist.view = d.v; render(); break;
    case 'histFilters': historyFilterSheet(); break;
    case 'histReset': { const keep = { view: ui.hist.view, week: ui.hist.week }; ui.hist = { ...HIST_DEFAULT(), ...keep }; closeDlg(); render(); break; }
    case 'histKinds': ui.hist.kinds = { all: ['cleaning', 'todo', 'update', 'step'], cleaning: ['cleaning'], todo: ['todo'], projects: ['update', 'step'] }[d.v]; ui.hist.limit = 60; render(); break;
    case 'histMore': ui.hist.limit += 60; render(); break;
    case 'gridWeek': ui.hist.week = Math.max(0, ui.hist.week + Number(d.v)); render(); break;
    case 'cell': toast(d.msg); break;
    case 'editName': nameForm(false); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'signOut': if (confirm('Sign out of Homebase on this device?')) signOut(auth); break;
    case 'resetPw': {
      const em = ($('#lEmail') || {}).value?.trim();
      if (!em) { $('#lErr').textContent = 'Type your email first, then tap Forgot password.'; break; }
      sendPasswordResetEmail(auth, em).then(() => { $('#lErr').textContent = 'Check your email for a reset link.'; }).catch(() => { $('#lErr').textContent = 'Could not send a reset email to that address.'; });
      break;
    }
    case 'sample':
      if (hasData() && !confirm('Replace everything (for everyone) with sample data?')) break;
      data = sampleData(); commit(); location.hash = '#today'; toast('Sample data loaded'); break;
    case 'erase':
      if (confirm('Erase everything in Homebase? This erases it for everyone in your household.') && confirm("Last check — this can't be undone. Erase?")) { data = normalize({ members: data.members, lastExport: data.lastExport }); commit(); location.hash = '#today'; }
      break;
  }
});
function postUpdate(pid) {
  const inp = $('#updText'), p = findP(pid);
  if (!inp || !p || !inp.value.trim()) return;
  p.updates.push({ id: uid(), date: todayISO(), text: inp.value.trim(), at: nowISO(), by: me() });
  if (p.status === 'planning') p.status = 'in-progress';
  touch(p); commit();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'updText') { e.preventDefault(); postUpdate(e.target.dataset.pid); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.change) { ui[e.target.dataset.change] = e.target.value; render(); }
  if (e.target.id === 'importFile' && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
  if (e.target.closest('#hform')) {
    if (e.target.name === 'from' || e.target.name === 'to') { const c = $('#hform [name=range][value=custom]'); if (c) c.checked = true; }
    updateFilterCount();
  }
});
$('#dlg').addEventListener('close', () => { formCtx = null; statOpen = null; setTimeout(flushRender, 0); });
document.addEventListener('focusout', e => { if (e.target.id === 'updText') setTimeout(flushRender, 0); });

/* ---------- start ---------- */
function init() {
  window.addEventListener('hashchange', () => {
    closeDlg(); render();
    const { v, id } = route();
    const det = v === 'rooms' && id && document.getElementById('roomDetail');
    if (det) det.scrollIntoView({ behavior: 'smooth', block: 'start' }); else window.scrollTo(0, 0);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#dlg').open) render(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!configured) { render(); return; }
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  render();
  onAuthStateChanged(auth, u => {
    authReady = true;
    user = u;
    if (u) startSync(); else { stopSync(); data = null; syncError = ''; }
    render();
  });
}
init();
</script>
</body>
</html>
